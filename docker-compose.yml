services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    container_name: do_an_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - indices.query.bool.max_clause_count=4096
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: do_an_web
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./models:/app/models
      - bge_m3_cache:/root/.cache
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=topcv_jobs_production
      - PYTHONPATH=/app/src
      - AUTO_IMPORT_ON_START=0
      - ENABLE_JOB_TERM_TAXONOMY=1
      # RRF k=10 (app default) + 0.5/0.45: best NDCG@10 in the production-aligned sweep
      - RRF_BM25_WEIGHT=0.5
      - RRF_KNN_WEIGHT=0.45
      - KNN_VECTOR_FIELD=embedding
      - BM25_QUERY_TERM_LIMIT=30
      - KNN_EXPANSION_TERM_LIMIT=12
      - ENABLE_QUERY_EXPANSION=0
      - ENABLE_ESCO_EXPANSION=1
      - ENABLE_SKILL_GRAPH_EXPANSION=0
      - ESCO_CONTROLLED_MIN_SIM=0.75
      - ESCO_CONTROLLED_MIN_MARGIN=0.01
      - ESCO_CONTROLLED_MAX_TERMS=6
      - BM25_MIN_SHOULD_MATCH=2
      - BM25_RELAXED_MIN_SHOULD_MATCH=1
      - RETRIEVAL_SIZE=100
      - RETRIEVAL_FALLBACK_MIN_SCORE=1.0
      - RETRIEVAL_FALLBACK_MAX_SCORE=5.0
      - SCORING_TOP_N=50
      - SCORING_BATCH_SIZE=5
      - GROQ_SCORING_MAX_COMPLETION_TOKENS=1500
      - GROQ_REASONING_EFFORT=low
      - SCORING_BATCH_WORKERS=7
      - SCORING_TIME_LIMIT_SECONDS=60
      - SCORING_KEY_REQUEST_INTERVAL_SECONDS=5
      - SCORING_REQUEST_TIMEOUT_SECONDS=20
      - USD_TO_VND_RATE=25000
      - LOCATION_DISTANCE_DECAY_KM=30
      - LOCATION_SCORE_FLOOR=1.5
      - PYTHONIOENCODING=utf-8
    env_file:
      - ./src/.env
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "1"
      - --threads
      - "4"
      - --timeout
      - "180"
      - --access-logfile
      - "-"
      - "job_matching.web.app:create_app()"
    stdin_open: true
    tty: true
    init: true

  ollama:
    image: ollama/ollama:latest
    container_name: do_an_ollama
    profiles:
      - crawl
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: do_an_scheduler
    profiles:
      - crawl
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=topcv_jobs_production
      - PYTHONPATH=/app/src
      - CRAWL_RECHECK_DAYS=7
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_CLEANER_MODEL=qwen3.5:4b
      - OLLAMA_CLEANER_NUM_CTX=8192
      - OLLAMA_CLEANER_NUM_PREDICT=1500
      - OLLAMA_CLEANER_TEMPERATURE=0.1
      - OLLAMA_CLEANER_TOP_P=0.9
      - OLLAMA_CLEANER_SEED=42
      - OLLAMA_CLEANER_STRUCTURED_OUTPUT=1
      - OLLAMA_CLEANER_THINK=0
      - AUTO_CLASSIFY_TAXONOMY=1
      - TAXONOMY_CLASSIFY_THRESHOLD=50
      - TAXONOMY_BATCH_SIZE=20
      - TAXONOMY_SLEEP_SEC=10
      - PYTHONIOENCODING=utf-8
    env_file:
      - ./src/.env
    command: python -m job_matching.ingestion.scheduler --once --pages 3 --threads 3

volumes:
  bge_m3_cache:
    driver: local
  es_data:
    driver: local
  ollama_data:
    driver: local
